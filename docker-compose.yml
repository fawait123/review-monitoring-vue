services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: review_monitor
    ports:
      # 5434: hindari bentrok dgn postgres lain di host (colima dkk)
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d review_monitor" ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/review_monitor
      # API key untuk model pi SDK (lihat server/config/models.json). Kosong → model terdaftar tapi unavailable.
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      # gh CLI dipakai server (collect/review) — pasang di image? tanpa ini collect gagal di docker.
      # CATATAN: jalankan `docker compose run app sh -c "apk add gh"` atau mount host gh via volume.
    ports:
      - "3303:3303"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
